services:
  # ========================================
  # СЕРВИС 1: Nginx reverse proxy (SSL termination)
  # ========================================
  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/legal:/usr/share/nginx/legal:ro
      - ./nginx/help:/usr/share/nginx/help:ro
      - ./nginx/well-known:/usr/share/nginx/well-known:ro
      - ./icon-512-rustore.png:/todo/icon-512-rustore.png:ro
      # Внешние конфиги других проектов (clickmebattle и др.).
      # Включаются в nginx/nginx.conf директивой `include /etc/nginx/external/*.conf;`.
      # Каталог на проде — /home/deploy/nginx-external, каждый проект сам кладёт туда свой .conf через свой CI.
      - /home/deploy/nginx-external:/etc/nginx/external:ro
      # Static content for keepware.ru landing (managed by the `site` user, see nginx-external/keepware.ru.conf).
      - /home/site/www:/var/www/keepware:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro

    depends_on:
      - todo-app
      - todo-web

    networks:
      - todo-network

    restart: unless-stopped

  # ========================================
  # СЕРВИС 2: Certbot (автообновление SSL-сертификатов)
  # ========================================
  certbot:
    image: certbot/certbot
    container_name: certbot

    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot

    # Проверка и обновление сертификатов каждые 12 часов
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done'"

    networks:
      - todo-network

    restart: unless-stopped

  # ========================================
  # СЕРВИС 3: Spring Boot приложение todo
  # ========================================
  todo-app:
    image: mngerasimenko/todo-app:latest
    build:
      context: .
      dockerfile: Dockerfile

    container_name: todo-app

    # Порты не пробрасываются наружу — доступ только через nginx-proxy
    #ports:
    #- "8090:8090"

    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/todo
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_PROFILES_ACTIVE=production
      - JAVA_TOOL_OPTIONS=${JAVA_TOOL_OPTIONS:--Xmx768m -Xms768m}
      - APP_VERSION=${APP_VERSION:-0.0.1}
      - MIN_ANDROID_VERSION=${MIN_ANDROID_VERSION:-1}
      - LATEST_ANDROID_VERSION=${LATEST_ANDROID_VERSION:-1}
      - HIKARI_POOL_SIZE=${HIKARI_POOL_SIZE:-30}
      - TOMCAT_THREADS_MAX=${TOMCAT_THREADS_MAX:-100}
      - TOMCAT_THREADS_MIN_SPARE=${TOMCAT_THREADS_MIN_SPARE:-10}
      - TOMCAT_ACCEPT_COUNT=${TOMCAT_ACCEPT_COUNT:-100}
      - MAIL_HOST=${MAIL_HOST:-smtp.jino.ru}
      - MAIL_PORT=${MAIL_PORT:-465}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_FROM=${MAIL_FROM:-todo-noreply@keepware.ru}
      - APP_BASE_URL=${APP_BASE_URL:-https://todo.keepware.ru}
      - JWT_SECRET=${JWT_SECRET:-}
      - SUBSCRIPTION_ENFORCEMENT=${SUBSCRIPTION_ENFORCEMENT:-false}
      - FREE_MAX_LISTS=${FREE_MAX_LISTS:-2}
      - FREE_MAX_TASKS=${FREE_MAX_TASKS:-30}
      - FREE_MAX_MEMBERS=${FREE_MAX_MEMBERS:-3}
      - FREE_PRIVATE_TASKS=${FREE_PRIVATE_TASKS:-false}
      - APP_INACTIVE_REMINDER_ENABLED=${INACTIVE_REMINDER_ENABLED:-true}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - APP_FIREBASE_ENABLED=${FIREBASE_ENABLED:-false}
      - FIREBASE_CREDENTIALS_PATH=${FIREBASE_CREDENTIALS_PATH:-/todo/firebase-service-account.json}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-localredispass}
      - RATE_LIMIT_STORAGE=redis
      - SUPER_ADMIN_EMAILS=${SUPER_ADMIN_EMAILS:-}
      # Break-glass: при сломанном кэше/auth поставить в .env RESPONSE_CACHE_ENABLED=false и пересоздать контейнер.
      - RESPONSE_CACHE_ENABLED=${RESPONSE_CACHE_ENABLED:-true}

    volumes:
      - todo-logs:/todo/logs
      - ./firebase-service-account.json:/todo/firebase-service-account.json:ro

    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8091/actuator/health | grep -q UP || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    networks:
      - todo-network

    # Автоматически перезапускать контейнер при падении
    restart: unless-stopped

  # ========================================
  # СЕРВИС 4: React UI (nginx)
  # ========================================
  todo-web:
    image: mngerasimenko/todo-web:latest
    container_name: todo-web
    # Порты не пробрасываются наружу — доступ только через nginx-proxy

    depends_on:
      - todo-app

    networks:
      - todo-network

    restart: unless-stopped

  # ========================================
  # СЕРВИС 5: postgres база данных
  # ========================================
  postgres-db:
    image: postgres:17
    container_name: postgres-db
    # Port NOT exposed to host — access only via Docker network (todo-app connects to postgres-db:5432)

    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=todo
      - POSTGRES_USER=postgres

    # PostgreSQL performance tuning (configured for 4GB RAM server)
    command: >
      postgres
      -c shared_buffers=${PG_SHARED_BUFFERS:-512MB}
      -c work_mem=${PG_WORK_MEM:-8MB}
      -c maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-64MB}
      -c effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-2GB}
      -c max_connections=${PG_MAX_CONNECTIONS:-100}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    networks:
      - todo-network

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 10s

    # Автоматически перезапускать контейнер при падении
    restart: unless-stopped

  # ========================================
  # СЕРВИС 6: redis
  # ========================================
  redis:
    image: redis:7-alpine
    container_name: todo-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-localredispass} --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - todo-network
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-localredispass}", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # ========================================
  # СЕРВИС 7: Prometheus (сбор метрик)
  # ========================================
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - todo-network
    restart: unless-stopped

  # ========================================
  # СЕРВИС 8: Grafana (визуализация метрик)
  # ========================================
  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - todo-network
    restart: unless-stopped

# ========================================
# СЕТИ
# ========================================
networks:
  todo-network:
    external: true

# ========================================
# ТОМЫ
# ========================================
volumes:
  postgres-data:
    external: true
  redis-data:
    external: true
  todo-logs:
    external: true
  certbot-conf:
    external: true
  certbot-www:
    external: true
  prometheus-data:
    external: true
  grafana-data:
    external: true
