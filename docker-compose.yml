services:
  # ========================================
  # СЕРВИС 1: Nginx reverse proxy (SSL termination)
  # ========================================
  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro

    depends_on:
      - todo-app
      - todo-web

    networks:
      - todo-network

    restart: unless-stopped

  # ========================================
  # СЕРВИС 2: Certbot (автообновление SSL-сертификатов)
  # ========================================
  certbot:
    image: certbot/certbot
    container_name: certbot

    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot

    # Проверка и обновление сертификатов каждые 12 часов
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done'"

    networks:
      - todo-network

    restart: unless-stopped

  # ========================================
  # СЕРВИС 3: Spring Boot приложение todo
  # ========================================
  todo-app:
    image: mngerasimenko/todo-app:latest
    build:
      context: .
      dockerfile: Dockerfile

    container_name: todo-app
    # Порты не пробрасываются наружу — доступ только через nginx-proxy

    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/todo
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_PROFILES_ACTIVE=production
      - JAVA_TOOL_OPTIONS=-Xmx160m -Xms160m
      - APP_VERSION=${APP_VERSION:-0.0.1}

    volumes:
      - todo-logs:/todo/logs

    depends_on:
      postgres-db:
        condition: service_healthy

    networks:
      - todo-network

    # Автоматически перезапускать контейнер при падении
    restart: unless-stopped

  # ========================================
  # СЕРВИС 4: React UI (nginx)
  # ========================================
  todo-web:
    image: mngerasimenko/todo-web:latest
    container_name: todo-web
    # Порты не пробрасываются наружу — доступ только через nginx-proxy

    depends_on:
      - todo-app

    networks:
      - todo-network

    restart: unless-stopped

  # ========================================
  # СЕРВИС 5: postgres база данных
  # ========================================
  postgres-db:
    image: postgres:17
    container_name: postgres-db
    ports:
      - "5433:5432"

    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=todo
      - POSTGRES_USER=postgres
      # Оптимизация памяти для серверов с 1GB RAM
      - POSTGRES_SHARED_BUFFERS=64MB
      - POSTGRES_WORK_MEM=2MB
      - POSTGRES_MAINTENANCE_WORK_MEM=32MB
      - POSTGRES_EFFECTIVE_CACHE_SIZE=256MB
      - POSTGRES_MAX_CONNECTIONS=50

    volumes:
      - postgres-data:/var/lib/postgresql/data

    networks:
      - todo-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

    # Автоматически перезапускать контейнер при падении
    restart: unless-stopped

# ========================================
# СЕТИ
# ========================================
networks:
  todo-network:
    external: true

# ========================================
# ТОМЫ
# ========================================
volumes:
  postgres-data:
    external: true
  todo-logs:
    external: true
  certbot-conf:
    external: true
  certbot-www:
    external: true
