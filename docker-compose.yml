services:
  # ========================================
  # СЕРВИС 1: Nginx reverse proxy (SSL termination)
  # ========================================
  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/legal:/usr/share/nginx/legal:ro
      - ./nginx/well-known:/usr/share/nginx/well-known:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro

    depends_on:
      - todo-app
      - todo-web

    networks:
      - todo-network

    restart: unless-stopped

  # ========================================
  # СЕРВИС 2: Certbot (автообновление SSL-сертификатов)
  # ========================================
  certbot:
    image: certbot/certbot
    container_name: certbot

    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot

    # Проверка и обновление сертификатов каждые 12 часов
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done'"

    networks:
      - todo-network

    restart: unless-stopped

  # ========================================
  # СЕРВИС 3: Spring Boot приложение todo
  # ========================================
  todo-app:
    image: mngerasimenko/todo-app:latest
    build:
      context: .
      dockerfile: Dockerfile

    container_name: todo-app
    # Порты не пробрасываются наружу — доступ только через nginx-proxy

    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/todo
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - SPRING_PROFILES_ACTIVE=production
      - JAVA_TOOL_OPTIONS=${JAVA_TOOL_OPTIONS:--Xmx768m -Xms768m}
      - APP_VERSION=${APP_VERSION:-0.0.1}
      - HIKARI_POOL_SIZE=${HIKARI_POOL_SIZE:-30}
      - TOMCAT_THREADS_MAX=${TOMCAT_THREADS_MAX:-100}
      - TOMCAT_THREADS_MIN_SPARE=${TOMCAT_THREADS_MIN_SPARE:-10}
      - TOMCAT_ACCEPT_COUNT=${TOMCAT_ACCEPT_COUNT:-100}
      - MAIL_HOST=${MAIL_HOST:-smtp.jino.ru}
      - MAIL_PORT=${MAIL_PORT:-465}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_FROM=${MAIL_FROM:-todo-noreply@keepware.ru}
      - APP_BASE_URL=${APP_BASE_URL:-https://todo.keepware.ru}

    volumes:
      - todo-logs:/todo/logs

    depends_on:
      postgres-db:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8091/actuator/health | grep -q UP || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    networks:
      - todo-network

    # Автоматически перезапускать контейнер при падении
    restart: unless-stopped

  # ========================================
  # СЕРВИС 4: React UI (nginx)
  # ========================================
  todo-web:
    image: mngerasimenko/todo-web:latest
    container_name: todo-web
    # Порты не пробрасываются наружу — доступ только через nginx-proxy

    depends_on:
      - todo-app

    networks:
      - todo-network

    restart: unless-stopped

  # ========================================
  # СЕРВИС 5: postgres база данных
  # ========================================
  postgres-db:
    image: postgres:17
    container_name: postgres-db
    ports:
      - "5433:5432"

    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=todo
      - POSTGRES_USER=postgres

    # PostgreSQL performance tuning (configured for 4GB RAM server)
    command: >
      postgres
      -c shared_buffers=${PG_SHARED_BUFFERS:-512MB}
      -c work_mem=${PG_WORK_MEM:-8MB}
      -c maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-64MB}
      -c effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-2GB}
      -c max_connections=${PG_MAX_CONNECTIONS:-100}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    networks:
      - todo-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres && psql -h 127.0.0.1 -U postgres -d todo -c 'SELECT 1' -q || (sed -i 's/scram-sha-256/trust/' /var/lib/postgresql/data/pg_hba.conf && su postgres -c 'pg_ctl reload -D /var/lib/postgresql/data' && false)"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 10s

    # Автоматически перезапускать контейнер при падении
    restart: unless-stopped

# ========================================
# СЕТИ
# ========================================
networks:
  todo-network:
    external: true

# ========================================
# ТОМЫ
# ========================================
volumes:
  postgres-data:
    external: true
  todo-logs:
    external: true
  certbot-conf:
    external: true
  certbot-www:
    external: true
