services:
  # ========================================
  # СЕРВИС 1: Spring Boot приложение todo
  # ========================================
  todo-app:
    image: todo-app:1.0
    build:
      context: .
      dockerfile: Dockerfile

    container_name: todo-app
    ports:
      - "8090:8090"

    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/todo
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_PROFILES_ACTIVE=production

    volumes:
      - todo-logs:/todo/logs

    depends_on:
      postgres-db:
        condition: service_healthy

    networks:
      - todo-network

    # Автоматически перезапускать контейнер при падении
    restart: unless-stopped

  # ========================================
  # СЕРВИС 2: postgres база данных
  # ========================================
  postgres-db:
    image: postgres:17
    container_name: postgres-db
    ports:
      - "5433:5432"

    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=todo
      - POSTGRES_USER=postgres

    volumes:
      - postgres-data:/var/lib/postgresql/data

    networks:
      - todo-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

    # Автоматически перезапускать контейнер при падении
    restart: unless-stopped

# ========================================
# СЕТИ
# ========================================
networks:
  todo-network:
#    external: true

# ========================================
# ТОМЫ (для сохранения данных БД)
# ========================================
volumes:
  postgres-data:
  todo-logs: