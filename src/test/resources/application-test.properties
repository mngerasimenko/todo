spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Liquibase disabled for H2 unit tests (schema managed by Hibernate ddl-auto)
spring.liquibase.enabled=false

# Disable email sending in tests
spring.mail.host=localhost
spring.mail.port=25

# Disable SMTP health check scheduler in tests
app.smtp-health-check.enabled=false

# Disable management port for tests (avoid port conflicts)
management.server.port=-1

# JWT secret for tests only (not used in production)
jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci1qd3QtdGVzdGluZy0yNTYtYml0cyEhISE=
