#spring.profiles.active=production

spring.datasource.url=jdbc:postgresql://localhost:5432/todo?
spring.datasource.username=postgres
spring.datasource.password=postgres
#spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Liquibase database migrations
spring.liquibase.change-log=classpath:db/migration/changelog-master.yaml

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=${HIKARI_POOL_SIZE:5}
# Periodic keepalive to detect dead connections (every 2 minutes)
spring.datasource.hikari.keepalive-time=120000
# Validate connections before use
spring.datasource.hikari.connection-test-query=SELECT 1
#spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=tru

# Redis connection
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:localredispass}
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

# Redis key prefixes
app.redis.key-prefix=todo

# Health check: don't fail whole app if Redis is down
management.health.redis.enabled=true

server.port=8090

# Graceful shutdown: wait for active requests to complete before stopping (max 30s)
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Tomcat thread pool (configured via env vars for different server sizes)
server.tomcat.threads.max=${TOMCAT_THREADS_MAX:30}
server.tomcat.threads.min-spare=${TOMCAT_THREADS_MIN_SPARE:5}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:50}

# Trust proxy headers (X-Forwarded-Proto, X-Forwarded-For) behind Nginx reverse proxy
server.forward-headers-strategy=framework

# JWT Configuration
# No fallback — app fails to start without JWT_SECRET (fail-safe)
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=14400000
jwt.refresh-token-expiration=31536000000

# App version (APP_VERSION is set dynamically by CI/CD from run number)
app.version=${APP_VERSION:0.0.1}
# Minimum Android client version required (single source of truth, not duplicated in deploy.yml)
app.min-android-version=${MIN_ANDROID_VERSION:1}
# Latest available Android version (soft update prompt)
app.latest-android-version=${LATEST_ANDROID_VERSION:1}
# AES-256-GCM encryption key for PII (Base64, 32 bytes). Empty = encryption disabled.
app.encryption-key=${ENCRYPTION_KEY:}

# CORS - allowed origins for React SPA (dev only, production overrides in application-production.properties)
app.cors-origins=http://localhost:5173,http://localhost:3000

# Rate limiting (Bucket4j)
# Trusted proxy header for real client IP (nginx sets X-Real-IP)
rate-limit.client-ip-header=X-Real-IP
rate-limit.login.requests=7
rate-limit.login.duration-seconds=300
rate-limit.register.requests=3
rate-limit.register.duration-seconds=3600
rate-limit.refresh.requests=10
rate-limit.refresh.duration-seconds=60
rate-limit.forgot-password.requests=3
rate-limit.forgot-password.duration-seconds=3600
rate-limit.verify-email.requests=10
rate-limit.verify-email.duration-seconds=60
rate-limit.reset-password.requests=10
rate-limit.reset-password.duration-seconds=60
rate-limit.resend-verification.requests=3
rate-limit.resend-verification.duration-seconds=3600
rate-limit.change-email.requests=3
rate-limit.change-email.duration-seconds=3600
rate-limit.suggestions.requests=60
rate-limit.suggestions.duration-seconds=60
rate-limit.general.requests=100
rate-limit.general.duration-seconds=60
rate-limit.cleanup-interval-ms=600000
rate-limit.storage=memory

# Super admin whitelist (comma-separated emails). Required for /api/admin/** access.
app.super-admin.emails=${SUPER_ADMIN_EMAILS:}

# Email (SMTP)
spring.mail.host=${MAIL_HOST:smtp.jino.ru}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
# Explicit SMTP timeouts to prevent infinite hang on unreachable provider.
# Without them JavaMail uses the OS-level TCP default (minutes), which would
# block @PostConstruct warmup in SmtpHealthScheduler and the scheduled check
# itself when the provider has an outage (Jino downtime 2026-04-27 was the trigger).
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.email.from=${MAIL_FROM:todo-noreply@keepware.ru}
app.email.base-url=${APP_BASE_URL:https://todo.keepware.ru}
app.email.verification-token-ttl-hours=24
app.email.reset-token-ttl-hours=1
# SMTP health-check interval in milliseconds (default 60 minutes).
# Frequent checks aren't needed — SMTP is a non-critical dependency
# (used only for email verification and password reset).
app.smtp-health-check.interval-ms=${SMTP_HEALTH_CHECK_INTERVAL_MS:3600000}

# Spring Boot Actuator — JVM monitoring
# Actuator runs on a separate management port (internal only, not exposed via nginx)
management.server.port=${MANAGEMENT_PORT:8091}
# Expose only required endpoints via HTTP
management.endpoints.web.exposure.include=health,metrics,info,usagestats,triggerreminder,prometheus
# Health endpoint: show full details (disk, db, etc.)
management.endpoint.health.show-details=always
# Info endpoint: include java runtime and OS info
management.info.java.enabled=true
management.info.os.enabled=true
# Add application label to all metrics (required for Grafana dashboards)
management.metrics.tags.application=todo-app

# Usage statistics logging interval (default 2 hours)
app.stats.interval-ms=${STATS_INTERVAL:7200000}

# Subscription enforcement (false = beta stage, no limits applied)
app.subscription-enforcement-enabled=${SUBSCRIPTION_ENFORCEMENT:false}

# Free tier limits
app.free-limits.max-lists=${FREE_MAX_LISTS:2}
app.free-limits.max-tasks-per-list=${FREE_MAX_TASKS:30}
app.free-limits.max-members-per-list=${FREE_MAX_MEMBERS:3}
app.free-limits.private-tasks-allowed=${FREE_PRIVATE_TASKS:false}

# Pro/Beta tier limits (-1 = unlimited)
app.pro-limits.max-lists=${PRO_MAX_LISTS:-1}
app.pro-limits.max-tasks-per-list=${PRO_MAX_TASKS:-1}
app.pro-limits.max-members-per-list=${PRO_MAX_MEMBERS:-1}
app.pro-limits.private-tasks-allowed=${PRO_PRIVATE_TASKS:true}

# Global suggestion dictionary (Server R-6)
# min-freq: occurrences threshold below which suggestion is hidden (filter for one-time typos)
# max-text-length: skip tracking strings longer than this (likely sentences, not products)
# min-prefix-length: skip suggest queries shorter than this (avoid 1-letter searches)
# max-limit / default-limit: client request limits and default page size
# cleanup-days: rows untouched for this many days are deleted by weekly scheduler
app.suggestions.min-freq=5
app.suggestions.max-text-length=30
app.suggestions.min-prefix-length=3
app.suggestions.max-limit=10
app.suggestions.default-limit=5
app.suggestions.cleanup-days=365

# OpenAPI / Swagger UI
springdoc.api-docs.path=/api/v3/api-docs
springdoc.swagger-ui.path=/api/swagger-ui.html
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.packages-to-scan=ru.mngerasimenko.todolist.controller
springdoc.swagger-ui.disable-swagger-default-url=true

# Thymeleaf — used only for email templates (no MVC views; project has only @RestController).
# prefix=classpath:/templates/, suffix=.html, encoding=UTF-8 are Spring Boot defaults.
# Tests with hot template reload can override via @TestPropertySource(properties = "spring.thymeleaf.cache=false").
spring.thymeleaf.cache=true