#spring.profiles.active=production

spring.datasource.url=jdbc:postgresql://localhost:5432/todo?
spring.datasource.username=postgres
spring.datasource.password=postgres
#spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Liquibase database migrations
spring.liquibase.change-log=classpath:db/migration/changelog-master.yaml

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
# Periodic keepalive to detect dead connections (every 2 minutes)
spring.datasource.hikari.keepalive-time=120000
# Validate connections before use
spring.datasource.hikari.connection-test-query=SELECT 1
#spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=tru

server.port=8090

# Tomcat thread pool (default 200 — too many for 1GB RAM, causes OOM)
server.tomcat.threads.max=30
server.tomcat.threads.min-spare=5
server.tomcat.accept-count=50

# Trust proxy headers (X-Forwarded-Proto, X-Forwarded-For) behind Nginx reverse proxy
server.forward-headers-strategy=framework

# JWT Configuration
jwt.secret=${JWT_SECRET:bXlTZWNyZXRLZXlGb3JKd3RUb2tlbkdlbmVyYXRpb25NdXN0QmVMb25nRW5vdWdoMjU2Qml0cw==}
jwt.access-token-expiration=3600000
#jwt.access-token-expiration=10000
jwt.refresh-token-expiration=604800000

# App version (APP_VERSION is set dynamically by CI/CD from run number)
app.version=${APP_VERSION:0.0.1}
# Minimum Android client version required (single source of truth, not duplicated in deploy.yml)
app.min-android-version=${MIN_ANDROID_VERSION:1}

# CORS - allowed origins for React SPA
app.cors-origins=http://localhost:5173,http://localhost:3000,http://185.244.172.45,http://185.244.172.45:3000,https://todo.mngerasimenko.ru

# Rate limiting (Bucket4j)
rate-limit.login.requests=5
rate-limit.login.duration-seconds=60
rate-limit.register.requests=3
rate-limit.register.duration-seconds=3600
rate-limit.refresh.requests=10
rate-limit.refresh.duration-seconds=60
rate-limit.general.requests=100
rate-limit.general.duration-seconds=60
rate-limit.cleanup-interval-ms=600000

# OpenAPI / Swagger UI
springdoc.api-docs.path=/api/v3/api-docs
springdoc.swagger-ui.path=/api/swagger-ui.html
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.packages-to-scan=ru.mngerasimenko.todolist.controller
springdoc.swagger-ui.disable-swagger-default-url=true