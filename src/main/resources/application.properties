#spring.profiles.active=production

spring.datasource.url=jdbc:postgresql://localhost:5432/todo?
spring.datasource.username=postgres
spring.datasource.password=postgres
#spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Liquibase database migrations
spring.liquibase.change-log=classpath:db/migration/changelog-master.yaml

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=${HIKARI_POOL_SIZE:5}
# Periodic keepalive to detect dead connections (every 2 minutes)
spring.datasource.hikari.keepalive-time=120000
# Validate connections before use
spring.datasource.hikari.connection-test-query=SELECT 1
#spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=tru

server.port=8090

# Graceful shutdown: wait for active requests to complete before stopping (max 30s)
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Tomcat thread pool (configured via env vars for different server sizes)
server.tomcat.threads.max=${TOMCAT_THREADS_MAX:30}
server.tomcat.threads.min-spare=${TOMCAT_THREADS_MIN_SPARE:5}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:50}

# Trust proxy headers (X-Forwarded-Proto, X-Forwarded-For) behind Nginx reverse proxy
server.forward-headers-strategy=framework

# JWT Configuration
# No fallback — app fails to start without JWT_SECRET (fail-safe)
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=3600000
#jwt.access-token-expiration=10000
jwt.refresh-token-expiration=604800000

# App version (APP_VERSION is set dynamically by CI/CD from run number)
app.version=${APP_VERSION:0.0.1}
# Minimum Android client version required (single source of truth, not duplicated in deploy.yml)
app.min-android-version=${MIN_ANDROID_VERSION:1}

# CORS - allowed origins for React SPA (dev only, production overrides in application-production.properties)
app.cors-origins=http://localhost:5173,http://localhost:3000

# Rate limiting (Bucket4j)
# Trusted proxy header for real client IP (nginx sets X-Real-IP)
rate-limit.client-ip-header=X-Real-IP
rate-limit.login.requests=7
rate-limit.login.duration-seconds=300
rate-limit.register.requests=3
rate-limit.register.duration-seconds=3600
rate-limit.refresh.requests=10
rate-limit.refresh.duration-seconds=60
rate-limit.forgot-password.requests=3
rate-limit.forgot-password.duration-seconds=3600
rate-limit.verify-email.requests=10
rate-limit.verify-email.duration-seconds=60
rate-limit.reset-password.requests=10
rate-limit.reset-password.duration-seconds=60
rate-limit.resend-verification.requests=3
rate-limit.resend-verification.duration-seconds=3600
rate-limit.change-email.requests=3
rate-limit.change-email.duration-seconds=3600
rate-limit.general.requests=100
rate-limit.general.duration-seconds=60
rate-limit.cleanup-interval-ms=600000

# Email (SMTP)
spring.mail.host=${MAIL_HOST:smtp.jino.ru}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
app.email.from=${MAIL_FROM:todo-noreply@keepware.ru}
app.email.base-url=${APP_BASE_URL:https://todo.keepware.ru}
app.email.verification-token-ttl-hours=24
app.email.reset-token-ttl-hours=1

# Spring Boot Actuator — JVM monitoring
# Actuator runs on a separate management port (internal only, not exposed via nginx)
management.server.port=${MANAGEMENT_PORT:8091}
# Expose only required endpoints via HTTP
management.endpoints.web.exposure.include=health,metrics,info,usagestats
# Health endpoint: show full details (disk, db, etc.)
management.endpoint.health.show-details=always
# Info endpoint: include java runtime and OS info
management.info.java.enabled=true
management.info.os.enabled=true

# Usage statistics logging interval (default 2 hours)
app.stats.interval-ms=${STATS_INTERVAL:7200000}

# Subscription enforcement (false = beta stage, no limits applied)
app.subscription-enforcement-enabled=${SUBSCRIPTION_ENFORCEMENT:false}

# Free tier limits
app.free-limits.max-lists=${FREE_MAX_LISTS:2}
app.free-limits.max-tasks-per-list=${FREE_MAX_TASKS:30}
app.free-limits.max-members-per-list=${FREE_MAX_MEMBERS:3}
app.free-limits.private-tasks-allowed=${FREE_PRIVATE_TASKS:false}

# Pro/Beta tier limits (-1 = unlimited)
app.pro-limits.max-lists=${PRO_MAX_LISTS:-1}
app.pro-limits.max-tasks-per-list=${PRO_MAX_TASKS:-1}
app.pro-limits.max-members-per-list=${PRO_MAX_MEMBERS:-1}
app.pro-limits.private-tasks-allowed=${PRO_PRIVATE_TASKS:true}

# OpenAPI / Swagger UI
springdoc.api-docs.path=/api/v3/api-docs
springdoc.swagger-ui.path=/api/swagger-ui.html
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.packages-to-scan=ru.mngerasimenko.todolist.controller
springdoc.swagger-ui.disable-swagger-default-url=true