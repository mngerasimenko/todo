# English translations for email subjects, bodies and FCM push notifications.
# Comments in this file MUST be in English. UTF-8 is enforced by Spring via I18nConfig.
# Placeholders use MessageFormat syntax: {0}, {1}, ... Only messages resolved WITH arguments go
# through MessageFormat — there a literal apostrophe must be written as ''. Messages resolved
# without arguments are returned verbatim (alwaysUseMessageFormat is off), so write a single '
# there, otherwise the reader sees '' literally. Adding a placeholder to an existing message
# means doubling its apostrophes.

app.name=TodoList

# Common email parts
email.common.fallback=If the button doesn't work, copy the link to your browser:

# Email: verify (sent after sign-up and on resend-verification)
email.verify.subject=Verify your email — TodoList
email.verify.title=Confirm your email
email.verify.intro=You have signed up for TodoList. Click the button below to confirm your email address.
email.verify.button=Confirm email
email.verify.expires=The link is valid for {0} hour(s). If you didn''t sign up, please ignore this email.

# Email: password reset
email.reset.subject=Password reset — TodoList
email.reset.title=Password reset
email.reset.intro=You requested a password reset for your account. Click the button below to set a new password.
email.reset.button=Reset password
email.reset.expires=The link is valid for {0} hour(s). If you didn''t request a password reset, please ignore this email.

# Email: invite to a shared list
# Subject: {0} — list name
# Intro: {0} — inviter name, {1} — list name (both HTML-escaped before passing in)
email.invite.subject=Invitation to the "{0}" list — TodoList
email.invite.title=List invitation
email.invite.intro=<strong>{0}</strong> invites you to the task list <strong>"{1}"</strong>. Click the button below to accept the invitation.
email.invite.button=Accept invitation
email.invite.expires=The link is valid for {0} hour(s). If you don''t know the sender, please ignore this email.

# Email: inactive-reminder (sent by InactiveReminderScheduler)
email.inactive.subject=We miss you! — TodoList
email.inactive.banner=We miss you!
email.inactive.greeting=Hi, {0}!
email.inactive.body=You haven't visited the app for several days. Your lists are waiting — maybe it's time to mark completed tasks or add new ones?
email.inactive.button=Open the app →
email.inactive.rustore_prefix=Or download an update on
email.inactive.rustore_link=RuStore
email.inactive.footer=This is an automated reminder from TodoList
email.inactive.image_alt=TodoList
email.inactive.fallback_name=friend

# Email: 3-day onboarding reminder (sent by OnboardingReminderScheduler, Phase 3.3).
# Encourages a first action rather than a return.
email.onboarding.subject=Ready to start? — TodoList
email.onboarding.banner=Ready to start?
email.onboarding.greeting=Hi, {0}!
email.onboarding.body=A few days ago you signed up for TodoList. Create your first list — it takes 30 seconds.
email.onboarding.button=Create a list →
email.onboarding.footer=This is an automated reminder from TodoList

# Email: due-date reminder for the user's own task (Task 7, sendTodoDueEmail).
# Greeting: {0} — user display name.
# Body: {0} — todo name, {1} — list name (both HTML-escaped in EmailServiceImpl before substitution),
# {2} — due date/time formatted as dd.MM.yyyy HH:mm (not user input, no escaping needed). The subject
# and banner deliberately don't claim "today" — remind_before_minutes can be up to a week, so the
# actual due moment must be stated in the body instead (finding from the final branch review).
email.todo.due.subject=Task reminder — TodoList
email.todo.due.banner=Task reminder
email.todo.due.greeting=Hi, {0}!
email.todo.due.body={0} — on the "{1}" list, due {2}.
email.todo.due.button=Open the list →
email.todo.due.footer=This is an automated reminder from TodoList

# Footer link for one-shot unsubscribe (shared between inactive and onboarding reminders).
email.footer.unsubscribe=Unsubscribe from reminders
# Footer link for todo due-date reminders — separate consent (todo_reminder_email_enabled),
# unsubscribe link carries scope=todo_due so it does not clear reminder_opt_out.
email.footer.todo_due_unsubscribe=Turn off task due-date emails

# FCM push notifications
# Messenger-style copy: title carries the verb, body is "<actor>: <object>" — gender-neutral
# and i18n-safe (no per-language gender/conjugation branching).
# push.todo.created.body: {0} — author name, {1} — todo name
push.todo.created.title=New task
push.todo.created.body={0}: {1}
# push.todo.done.body: {0} — completor name, {1} — todo name
push.todo.done.title=Task done ✓
push.todo.done.body={0}: {1}
# push.member.added.body: {0} — new member name, {1} — list name
push.member.added.title=New member
push.member.added.body={0}: {1}
# push.inactive.body: {0} — user display name (or push.fallback.name)
push.inactive.title=We miss you! ✅
push.inactive.body={0}, your lists are waiting — drop in!
# push.onboarding.* — 3-day onboarding reminder (Phase 3.3, OnboardingReminderScheduler).
# Focus is "try the app now" rather than "come back".
# push.onboarding.body: {0} — user display name (or push.fallback.name)
push.onboarding.title=Ready to start?
push.onboarding.body={0}, create your first list — takes 30 seconds.
push.fallback.name=friend
# push.todo.due.* — due date reminder (Task 6, sendTodoDuePush).
# Title deliberately doesn't claim "today" — remind_before_minutes can be up to a week.
# push.todo.due.body: {0} — todo name, {1} — due date/time formatted as dd.MM.yyyy HH:mm
push.todo.due.title=Task reminder
push.todo.due.body={0} — due {1}

# HTML page shown when the user opens the one-shot unsubscribe link
# from a reminder email footer (Phase 3.3 + unsubscribe).
unsubscribe.success.title=You're unsubscribed
unsubscribe.success.body=We won't send you any more inactivity reminders.
unsubscribe.success.note=If you change your mind — sign in and keep using the app as usual.
# Invalid/expired/already-used token and concurrent-hit fallback — neutral page
unsubscribe.invalid.title=Link already used
unsubscribe.invalid.body=You may have already unsubscribed, or the link has expired.
# unsubscribe.invalid.contact: {0} — support email
unsubscribe.invalid.contact=If you still receive reminders and want to unsubscribe — email us at {0}.
unsubscribe.cta.open=Open the app

# Bean Validation messages for REST request DTOs: annotations reference them as {validation.*}.
# Language is picked from Accept-Language (see AcceptLanguageMessageInterpolator).
# These keys are resolved WITHOUT arguments, so MessageFormat quoting does NOT apply:
# a literal apostrophe stays as typed, and '' would reach the client doubled.
# {min} and {max} are constraint attributes substituted by Hibernate Validator;
# characters { } $ \ are special to it.
# Email
validation.email.required=Email is required
validation.email.format=Invalid email format
validation.email.max-length=Email must not exceed {max} characters
# Password
validation.password.required=Password is required
validation.password.size=Password must be between {min} and {max} characters
validation.new-password.required=New password is required
validation.current-password.required=Current password is required
# User name
validation.name.required=Name is required
validation.name.size=Name must be between {min} and {max} characters
validation.name.invalid-characters=Name contains invalid characters
# One-time tokens (email verification, password reset, list invite)
validation.token.required=Token is required
validation.invite-token.required=Invite token is required
# Locale (BCP-47 tag)
validation.locale.required=Locale is required
validation.locale.format=Locale must be a valid BCP-47 tag
validation.locale.max-length=Locale must not exceed {max} characters
# Lists
validation.list-name.required=List name is required
validation.list-name.size=List name must be between {min} and {max} characters
validation.list-name.invalid-characters=List name contains invalid characters
# Todos
validation.todo-name.required=Todo name is required
validation.todo-name.size=Todo name must be between {min} and {max} characters
validation.todo-name.invalid-characters=Todo name contains invalid characters
validation.todo.created-at.required=Created at is required
validation.todo.done.required=Done status is required
validation.todo.user-id.required=User ID is required
validation.todo.list-id.required=List ID is required
validation.todo.client-request-id.max-length=client_request_id must not exceed {max} characters
# Reordering lists and todos
validation.reorder.items.required=Items list must not be empty
validation.reorder.id.required=id is required
validation.reorder.position.required=position is required
validation.reorder.position.non-negative=position must be >= 0
# Push tokens
validation.push.fcm-token.required=FCM token is required
validation.push.device-id.required=Device ID is required
# Colors
validation.color.format=Color must be in HEX format (#RRGGBB)
validation.color.created-task.required=Created task color is required
validation.color.completed-task.required=Completed task color is required
# Sort preferences
validation.sort.mode.format=Sort mode must be MANUAL, ALPHABETICAL or CREATED_AT
validation.sort.direction.format=Sort direction must be ASC or DESC
# Auth: single answer to every failed login (see the Russian bundle for the reasoning).
auth.invalid-credentials=Invalid email or password
# Auth: login could not be attempted at all (see the Russian bundle for the reasoning).
auth.service-unavailable=Service temporarily unavailable, please try again later
