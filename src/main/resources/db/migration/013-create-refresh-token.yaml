databaseChangeLog:
  - changeSet:
      id: 013-create-refresh-token
      author: todolist
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: refresh_token
      changes:
        - createTable:
            tableName: refresh_token
            columns:
              - column:
                  name: id
                  type: bigserial
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: token_hash
                  type: varchar(64)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_refresh_token_user
                    references: todo_users(id)
                    deleteCascade: true

              - column:
                  name: family_id
                  type: uuid
                  constraints:
                    nullable: false

              - column:
                  name: revoked
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false

              - column:
                  name: expires_at
                  type: timestamp
                  constraints:
                    nullable: false

              - column:
                  name: version
                  type: bigint

        - createIndex:
            indexName: idx_refresh_token_hash
            tableName: refresh_token
            columns:
              - column:
                  name: token_hash

        - createIndex:
            indexName: idx_refresh_token_user_id
            tableName: refresh_token
            columns:
              - column:
                  name: user_id

        - createIndex:
            indexName: idx_refresh_token_family_id
            tableName: refresh_token
            columns:
              - column:
                  name: family_id
