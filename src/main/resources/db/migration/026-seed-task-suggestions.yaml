databaseChangeLog:
  - changeSet:
      id: 026-seed-task-suggestions
      author: mngerasimenko
      comment: "Server R-6: посев словаря подсказок. 36 продуктов (freq = число вхождений из агрегации прод-задач, 2026-06-22, только однословные users>=2, без персонального/составного хвоста) + 22 глагола-старта (freq=5). ON CONFLICT (text) = floor через GREATEST — не понижает живые счётчики. dbms postgresql: H2-тесты пропускают (NOW()/ON CONFLICT)."
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: task_suggestion
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: >
              INSERT INTO task_suggestion (text, text_display, freq, last_used_at, blocked) VALUES
