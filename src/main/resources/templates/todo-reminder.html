<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{email.todo.due.subject}">Наш список — Напоминание о задаче</title>
</head>
<body style="margin:0;padding:0;background:#f4f4f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f5;padding:32px 0;">
    <tr>
        <td align="center">
            <table width="480" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.08);">
                <!-- Header -->
                <tr>
                    <td style="background:linear-gradient(135deg,#f59e0b 0%,#d97706 100%);padding:28px 32px;text-align:center;">
                        <h1 style="color:#ffffff;font-size:20px;font-weight:800;margin:0;" th:text="#{app.name}">Наш список</h1>
                        <p style="color:rgba(255,255,255,0.85);font-size:13px;margin:4px 0 0;" th:text="#{email.todo.due.banner}">Напоминание о задаче</p>
                    </td>
                </tr>
                <!-- Body -->
                <tr>
                    <td style="padding:32px 28px;text-align:center;">
                        <p style="color:#1f2937;font-size:15px;line-height:1.6;margin:0 0 16px;text-align:left;" th:text="#{email.todo.due.greeting(${userName})}">
                            Привет, друг!
                        </p>
                        <!-- todoName и listName приходят уже HTML-экранированными из EmailServiceImpl;
                             dueAt — отформатированная строка dd.MM.yyyy HH:mm, не пользовательский ввод;
                             th:utext нужен для подстановки в форматную строку email.todo.due.body -->
                        <p style="color:#6b7280;font-size:14px;line-height:1.6;margin:0 0 24px;text-align:left;" th:utext="#{email.todo.due.body(${todoName}, ${listName}, ${dueAt})}">
                            Полить теплицу — в списке «Дача», срок: 31.07.2026 18:00.
                        </p>
                        <!-- CTA Button -->
                        <table width="100%" cellpadding="0" cellspacing="0">
                            <tr>
                                <td align="center" style="padding-bottom:8px;">
                                    <a th:href="${listUrl}" href="#" style="display:inline-block;background:linear-gradient(135deg,#f59e0b,#d97706);color:#ffffff;font-size:15px;font-weight:700;padding:14px 36px;border-radius:12px;text-decoration:none;" th:text="#{email.todo.due.button}">
                                        Открыть список →
                                    </a>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
                <!-- Footer -->
                <tr>
                    <td style="background:#f9fafb;padding:20px 28px;text-align:center;border-top:1px solid #e5e7eb;">
                        <p style="color:#9ca3af;font-size:11px;margin:0;" th:text="#{email.todo.due.footer}">
                            Это автоматическое напоминание от приложения «Наш список»
                        </p>
                        <p style="margin:8px 0 0;font-size:11px;" th:if="${unsubscribeUrl}">
                            <a th:href="${unsubscribeUrl}" href="#"
                               style="color:#9ca3af;text-decoration:underline;"
                               th:text="#{email.footer.todo_due_unsubscribe}">Отключить письма о сроках задач</a>
                        </p>
                    </td>
                </tr>
            </table>
            <!-- Tracking pixel -->
            <img th:src="${trackOpenLink}" src="" width="1" height="1" alt="" style="display:none;" />
        </td>
    </tr>
</table>
</body>
</html>
