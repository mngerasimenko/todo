<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{email.onboarding.subject}">Список задач — Готовы попробовать?</title>
</head>
<body style="margin:0;padding:0;background:#f4f4f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f5;padding:32px 0;">
    <tr>
        <td align="center">
            <table width="480" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.08);">
                <!-- Header -->
                <tr>
                    <td style="background:linear-gradient(135deg,#4285f4 0%,#1d6dd9 100%);padding:28px 32px;text-align:center;">
                        <h1 style="color:#ffffff;font-size:20px;font-weight:800;margin:0;" th:text="#{app.name}">Список задач</h1>
                        <p style="color:rgba(255,255,255,0.85);font-size:13px;margin:4px 0 0;" th:text="#{email.onboarding.banner}">Готовы попробовать?</p>
                    </td>
                </tr>
                <!-- Body -->
                <tr>
                    <td style="padding:32px 28px;text-align:center;">
                        <img src="https://todo.keepware.ru/icon-512-rustore.png?v=1" th:alt="#{email.inactive.image_alt}" alt="Список задач" width="64" height="64" style="display:block;margin:0 auto 16px;border-radius:14px;" />
                        <p style="color:#1f2937;font-size:15px;line-height:1.6;margin:0 0 16px;text-align:left;" th:text="#{email.onboarding.greeting(${userName})}">
                            Привет, друг!
                        </p>
                        <p style="color:#6b7280;font-size:14px;line-height:1.6;margin:0 0 24px;" th:text="#{email.onboarding.body}">
                            Несколько дней назад вы зарегистрировались. Создайте первый список — это занимает 30 секунд.
                        </p>
                        <!-- CTA Button -->
                        <table width="100%" cellpadding="0" cellspacing="0">
                            <tr>
                                <td align="center" style="padding-bottom:24px;">
                                    <a th:href="${trackClickLink}" href="#" style="display:inline-block;background:linear-gradient(135deg,#4285f4,#1d6dd9);color:#ffffff;font-size:15px;font-weight:700;padding:14px 36px;border-radius:12px;text-decoration:none;" th:text="#{email.onboarding.button}">
                                        Открыть приложение →
                                    </a>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
                <!-- Footer -->
                <tr>
                    <td style="background:#f9fafb;padding:20px 28px;text-align:center;border-top:1px solid #e5e7eb;">
                        <p style="color:#9ca3af;font-size:11px;margin:0;" th:text="#{email.onboarding.footer}">
                            Это автоматическое напоминание от приложения «Список задач»
                        </p>
                        <p style="margin:8px 0 0;font-size:11px;" th:if="${unsubscribeUrl}">
                            <a th:href="${unsubscribeUrl}" href="#"
                               style="color:#9ca3af;text-decoration:underline;"
                               th:text="#{email.footer.unsubscribe}">Отписаться от напоминаний</a>
                        </p>
                    </td>
                </tr>
            </table>
            <!-- Tracking pixel -->
            <img th:src="${trackOpenLink}" src="" width="1" height="1" alt="" style="display:none;" />
        </td>
    </tr>
</table>
</body>
</html>
