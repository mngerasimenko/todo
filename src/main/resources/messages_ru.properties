# Russian translations for email subjects, bodies and FCM push notifications.
# Comments in this file MUST be in English (Java ResourceBundle uses ISO-8859-1 by default;
# Spring's ResourceBundleMessageSource overrides to UTF-8 via I18nConfig).
# Placeholders use MessageFormat syntax: {0}, {1}, ... — quote any literal apostrophes as ''.

app.name=Список задач

# Common email parts
email.common.fallback=Если кнопка не работает, скопируйте ссылку в браузер:

# Email: verify (sent after sign-up and on resend-verification)
email.verify.subject=Подтвердите email — Список задач
email.verify.title=Подтвердите ваш email
email.verify.intro=Вы зарегистрировались в приложении «Список задач». Нажмите кнопку ниже, чтобы подтвердить ваш email-адрес.
email.verify.button=Подтвердить email
email.verify.expires=Ссылка действительна {0} ч. Если вы не регистрировались — просто проигнорируйте это письмо.

# Email: password reset
email.reset.subject=Сброс пароля — Список задач
email.reset.title=Сброс пароля
email.reset.intro=Вы запросили сброс пароля для вашего аккаунта. Нажмите кнопку ниже, чтобы установить новый пароль.
email.reset.button=Сбросить пароль
email.reset.expires=Ссылка действительна {0} ч. Если вы не запрашивали сброс пароля — просто проигнорируйте это письмо.

# Email: invite to a shared list
# Subject: {0} — list name
# Intro: {0} — inviter name, {1} — list name (both HTML-escaped before passing in)
email.invite.subject=Приглашение в список «{0}» — Список задач
email.invite.title=Приглашение в список
email.invite.intro=<strong>{0}</strong> приглашает вас в список задач <strong>«{1}»</strong>. Нажмите кнопку ниже, чтобы принять приглашение.
email.invite.button=Принять приглашение
email.invite.expires=Ссылка действительна {0} ч. Если вы не знаете отправителя — просто проигнорируйте это письмо.

# Email: inactive-reminder (sent by InactiveReminderScheduler)
email.inactive.subject=Мы скучаем! — Список задач
email.inactive.banner=Мы скучаем!
email.inactive.greeting=Привет, {0}!
email.inactive.body=Вы не заходили в приложение уже несколько дней. Ваши списки ждут — может, пора отметить выполненные задачи или добавить новые?
email.inactive.button=Открыть приложение →
email.inactive.rustore_prefix=Или скачайте обновление в
email.inactive.rustore_link=RuStore
email.inactive.footer=Это автоматическое напоминание от приложения «Список задач»
email.inactive.image_alt=Список задач
email.inactive.fallback_name=друг

# Email: 3-day onboarding reminder (sent by OnboardingReminderScheduler, Phase 3.3).
# Encourages a first action rather than a return.
email.onboarding.subject=Готовы попробовать? — Список задач
email.onboarding.banner=Готовы попробовать?
email.onboarding.greeting=Привет, {0}!
email.onboarding.body=Несколько дней назад вы зарегистрировались в приложении «Список задач». Создайте первый список — это занимает 30 секунд.
email.onboarding.button=Создать список →
email.onboarding.footer=Это автоматическое напоминание от приложения «Список задач»

# Footer link for one-shot unsubscribe (shared between inactive and onboarding reminders).
email.footer.unsubscribe=Отписаться от напоминаний

# FCM push notifications
# push.todo.created.body: {0} — author name, {1} — todo name
push.todo.created.title=Новая задача
push.todo.created.body={0} добавил: «{1}»
# push.todo.done.body: {0} — completor name, {1} — todo name
push.todo.done.title=Задача выполнена ✓
push.todo.done.body={0} выполнил: «{1}»
# push.member.added.body: {0} — new member name, {1} — list name
push.member.added.title=Новый участник
push.member.added.body={0} присоединился к списку «{1}»
# push.inactive.body: {0} — user display name (or push.fallback.name)
push.inactive.title=Мы скучаем! ✅
push.inactive.body={0}, ваши списки ждут — загляните!
# push.onboarding.* — 3-day onboarding reminder (Phase 3.3, OnboardingReminderScheduler).
# Focus is "try the app now" rather than "come back".
# push.onboarding.body: {0} — user display name (or push.fallback.name)
push.onboarding.title=Готовы попробовать?
push.onboarding.body={0}, создайте первый список — это займёт 30 секунд.
push.fallback.name=друг

# HTML page shown when the user opens the one-shot unsubscribe link
# from a reminder email footer (Phase 3.3 + unsubscribe).
unsubscribe.success.title=Вы отписались
unsubscribe.success.body=Мы больше не будем присылать напоминания о неактивности.
unsubscribe.success.note=Если передумаете — войдите в приложение и продолжайте пользоваться обычно.
# Invalid/expired/already-used token and concurrent-hit fallback — neutral page
unsubscribe.invalid.title=Ссылка уже использована
unsubscribe.invalid.body=Возможно, вы уже отписались ранее, либо ссылка истекла.
# unsubscribe.invalid.contact: {0} — support email
unsubscribe.invalid.contact=Если продолжаете получать напоминания и хотите отписаться — напишите нам на {0}.
unsubscribe.cta.open=Открыть приложение
