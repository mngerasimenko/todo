# Цели портфельной опрашивалки (monitoring/portfolio-monitor.sh).
#
# Формат: host|checks|http_path|expect_code
#   checks     — через запятую из {tls, http}
#   http_path  — путь для проверки http (по умолчанию /)
#   expect_code— ожидаемый код (по умолчанию 200)
#
# TLS берётся ИЗ РУКОПОЖАТИЯ, а не с диска: именно этим отличается отказ, который
# убил бота replyAI 14.08.2026 — на диске лежал свежий серт, nginx держал в памяти
# старый. Порог по умолчанию 21 день (CERT_WARN_DAYS): Let's Encrypt продлевает за
# 30 дней до конца, поэтому серт в эфире с остатком меньше 21 дня означает, что
# продление уже сломано, и сообщает об этом за три недели до обрыва.
#
# Проверка http стоит только там, где «здоровый ответ» однозначен и проверен.
# Критерии осмысленного ответа для replyAI, vpscan и keepware-site собирает /ideas
# отдельным нарядом — до него сюда добавляется только tls, чтобы не получить стену
# ложных срабатываний на чужих контрактах.
#
# Все девять имён проверены на рукопожатие 08.09.2026; они покрывают все семь
# сертификатов certbot на проде (keepware.ru и www — один серт, api.replyai и
# staging-api.replyai — один SAN-серт).

todo.keepware.ru|tls,http|/api/status|200
todo.mngerasimenko.ru|tls||
keepware.ru|tls||
www.keepware.ru|tls||
vpscan.keepware.ru|tls||
clickmebattle.keepware.ru|tls||
clickmebattle.mngerasimenko.ru|tls||
api.replyai.keepware.ru|tls||
staging-api.replyai.keepware.ru|tls||
