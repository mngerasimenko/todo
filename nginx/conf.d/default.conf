# Nginx reverse proxy с SSL termination
# Все HTTPS-соединения терминируются здесь, бэкенд-сервисы работают по HTTP внутри Docker-сети

# Скрыть версию nginx в заголовке Server
server_tokens off;

# Редирект HTTP -> HTTPS + ACME challenge для certbot
server {
    listen 80;
    server_name todo.keepware.ru todo.mngerasimenko.ru;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Все остальные запросы — редирект на HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — основной сервер (keepware.ru)
server {
    listen 443 ssl;
    http2 on;
    server_name todo.keepware.ru;

    # SSL-сертификаты Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/todo.keepware.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/todo.keepware.ru/privkey.pem;

    # TLS 1.2 и 1.3
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # HSTS — браузер запоминает HTTPS на 1 год
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # CSP — защита от XSS (запрещает inline-скрипты и загрузку с чужих доменов)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'" always;

    # Защита от MIME-type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Защита от clickjacking (дублирует CSP frame-ancestors для старых браузеров)
    add_header X-Frame-Options "DENY" always;

    # Контроль отправки Referer-заголовка
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Ограничение доступа к браузерным API (камера, микрофон, геолокация и т.д.)
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Docker DNS resolver
    resolver 127.0.0.11 valid=5s;

    # Legal pages — static HTML (privacy policy, terms of service)
    # English variants are served from explicit /privacy/en and /terms/en paths;
    # clients select the version themselves by Locale (Android) or i18n.language (Web).
    location = /privacy {
        alias /usr/share/nginx/legal/privacy.html;
        default_type text/html;
    }
    location = /privacy/en {
        alias /usr/share/nginx/legal/privacy_en.html;
        default_type text/html;
    }
    location = /terms {
        alias /usr/share/nginx/legal/terms.html;
        default_type text/html;
    }
    location = /terms/en {
        alias /usr/share/nginx/legal/terms_en.html;
        default_type text/html;
    }

    # Help pages
    location = /help {
        alias /usr/share/nginx/help/index.html;
        default_type text/html;
    }
    location = /help/en {
        alias /usr/share/nginx/help/index_en.html;
        default_type text/html;
    }
    location = /help/android {
        alias /usr/share/nginx/help/android.html;
        default_type text/html;
    }
    location = /help/android/en {
        alias /usr/share/nginx/help/android_en.html;
        default_type text/html;
    }
    location /help/img/ {
        alias /usr/share/nginx/help/img/;
    }

    # Security.txt — контакт для сообщений об уязвимостях (RFC 9116)
    location = /.well-known/security.txt {
        alias /usr/share/nginx/well-known/security.txt;
        default_type text/plain;
    }

    # Android App Links — Digital Asset Links
    location = /.well-known/assetlinks.json {
        default_type application/json;
        return 200 '[{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":"ru.mngerasimenko.todolist","sha256_cert_fingerprints":["EC:D0:84:C7:D8:91:0D:34:60:70:75:BB:D3:25:15:97:CF:C4:93:8E:B0:31:3E:EB:C0:66:C1:B4:F4:A0:5E:A3","DF:AB:49:36:EB:03:0B:25:9C:87:FE:73:88:A4:34:90:A5:39:32:C4:84:7B:04:DF:F0:9A:0E:7D:15:74:AD:55"]}}]';
    }

    # Статическая иконка для email-шаблонов
    location = /icon-512-rustore.png {
        alias /todo/icon-512-rustore.png;
    }

    # Deep link для открытия Android-приложения из email
    # Если приложение установлено — Android перехватит ссылку, иначе — redirect на web
    location = /open {
        return 302 /;
    }

    # API — проксирование на Spring Boot
    set $backend http://todo-app:8090;
    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # React SPA — проксирование на todo-web (nginx внутри контейнера)
    set $frontend http://todo-web:80;
    location / {
        proxy_pass $frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Буферы для крупных ассетов (JS-бандл ~223 KB gzip не помещался
        # в дефолтные 8x4K и писался во временный файл на диск).
        proxy_buffer_size 32k;
        proxy_buffers 16 32k;
        proxy_busy_buffers_size 64k;
    }
}

# HTTPS — todo.mngerasimenko.ru (301 redirect на keepware.ru)
server {
    listen 443 ssl;
    http2 on;
    server_name todo.mngerasimenko.ru;

    ssl_certificate /etc/letsencrypt/live/todo.mngerasimenko.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/todo.mngerasimenko.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Redirect всех запросов на основной домен
    return 301 https://todo.keepware.ru$request_uri;
}
# HTTP — vpscan.keepware.ru (редирект на HTTPS + acme-challenge)
server {
    listen 80;
    server_name vpscan.keepware.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — vpscan.keepware.ru
server {
    listen 443 ssl;
    http2 on;
    server_name vpscan.keepware.ru;

    ssl_certificate /etc/letsencrypt/live/vpscan.keepware.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vpscan.keepware.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://vpscan-app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # vpscan-app отдаёт ~1MB на GET /, default proxy_buffers (8x4K=32K) не вмещает
        # — nginx пишет временный файл на диск. Совпадает с фиксом PR #67 для todo.
        proxy_buffer_size 32k;
        proxy_buffers 16 32k;
        proxy_busy_buffers_size 64k;
    }
}

# Внешние конфиги других проектов на этом хосте (clickmebattle и др.).
# Каталог монтируется как volume в nginx-proxy (см. docker-compose.yml).
# Каждый проект сам кладёт туда свой *.conf через свой CI.
# Если каталог пуст — nginx не падает (glob легально возвращает 0 совпадений).
# Защита от битого external-файла реализована в .github/workflows/deploy.yml
# (карантинируем .conf при неудачном старте nginx-proxy).
include /etc/nginx/external/*.conf;
