# Nginx reverse proxy с SSL termination
# Все HTTPS-соединения терминируются здесь, бэкенд-сервисы работают по HTTP внутри Docker-сети

# Скрыть версию nginx в заголовке Server
server_tokens off;

# Редирект HTTP -> HTTPS + ACME challenge для certbot
server {
    listen 80;
    server_name todo.keepware.ru todo.mngerasimenko.ru;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Все остальные запросы — редирект на HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — основной сервер (keepware.ru)
server {
    listen 443 ssl;
    http2 on;
    server_name todo.keepware.ru;

    # SSL-сертификаты Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/todo.keepware.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/todo.keepware.ru/privkey.pem;

    # TLS 1.2 и 1.3
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # HSTS — браузер запоминает HTTPS на 1 год
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # CSP — защита от XSS (запрещает inline-скрипты и загрузку с чужих доменов)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Docker DNS resolver
    resolver 127.0.0.11 valid=5s;

    # Legal pages — static HTML (privacy policy, terms of service)
    location = /privacy {
        alias /usr/share/nginx/legal/privacy.html;
        default_type text/html;
    }
    location = /terms {
        alias /usr/share/nginx/legal/terms.html;
        default_type text/html;
    }

    # Help pages
    location = /help {
        alias /usr/share/nginx/help/index.html;
        default_type text/html;
    }
    location = /help/android {
        alias /usr/share/nginx/help/android.html;
        default_type text/html;
    }
    location /help/img/ {
        alias /usr/share/nginx/help/img/;
    }

    # Android App Links — Digital Asset Links
    location = /.well-known/assetlinks.json {
        default_type application/json;
        return 200 '[{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":"ru.mngerasimenko.todolist","sha256_cert_fingerprints":["EC:D0:84:C7:D8:91:0D:34:60:70:75:BB:D3:25:15:97:CF:C4:93:8E:B0:31:3E:EB:C0:66:C1:B4:F4:A0:5E:A3","DF:AB:49:36:EB:03:0B:25:9C:87:FE:73:88:A4:34:90:A5:39:32:C4:84:7B:04:DF:F0:9A:0E:7D:15:74:AD:55"]}}]';
    }

    # API — проксирование на Spring Boot
    set $backend http://todo-app:8090;
    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # React SPA — проксирование на todo-web (nginx внутри контейнера)
    set $frontend http://todo-web:80;
    location / {
        proxy_pass $frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTPS — todo.mngerasimenko.ru (301 redirect на keepware.ru)
server {
    listen 443 ssl;
    http2 on;
    server_name todo.mngerasimenko.ru;

    ssl_certificate /etc/letsencrypt/live/todo.mngerasimenko.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/todo.mngerasimenko.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Redirect всех запросов на основной домен
    return 301 https://todo.keepware.ru$request_uri;
}
