# Nginx reverse proxy с SSL termination
# Все HTTPS-соединения терминируются здесь, бэкенд-сервисы работают по HTTP внутри Docker-сети

# Редирект HTTP -> HTTPS + ACME challenge для certbot
server {
    listen 80;
    server_name todo.mngerasimenko.ru;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Все остальные запросы — редирект на HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — основной сервер
server {
    listen 443 ssl;
    http2 on;
    server_name todo.mngerasimenko.ru;

    # SSL-сертификаты Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/todo.mngerasimenko.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/todo.mngerasimenko.ru/privkey.pem;

    # TLS 1.2 и 1.3
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # HSTS — браузер запоминает HTTPS на 1 год
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Docker DNS resolver
    resolver 127.0.0.11 valid=5s;

    # Legal pages — static HTML (privacy policy, terms of service)
    location = /privacy {
        alias /usr/share/nginx/legal/privacy.html;
        default_type text/html;
    }
    location = /terms {
        alias /usr/share/nginx/legal/terms.html;
        default_type text/html;
    }

    # API — проксирование на Spring Boot
    set $backend http://todo-app:8090;
    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # React SPA — проксирование на todo-web (nginx внутри контейнера)
    set $frontend http://todo-web:80;
    location / {
        proxy_pass $frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
