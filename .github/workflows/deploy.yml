name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  # ============================================
  # Этап 1: Запуск тестов с покрытием
  # ============================================
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests with JaCoCo coverage
        run: mvn clean test

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 30

  # ============================================
  # Этап 2: Сборка и деплой (только для пуши в master)
  # ============================================
  deploy:
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      APP_VERSION_MAJOR: 0
      APP_VERSION_MINOR: 0

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build package (skip tests — already passed)
        run: mvn clean package -DskipTests

      - name: Archive application JAR
        uses: actions/upload-artifact@v4
        with:
          name: todo-app-jar
          path: target/*.jar

      - name: Build Docker image
        run: docker build -t mngerasimenko/todo-app:${{ github.sha }} .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Push to Docker Hub
        run: docker push mngerasimenko/todo-app:${{ github.sha }}

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root

            # Создаём сеть, если не существует
            docker network create todo-network 2>/dev/null || true

            # Запускаем/перезапускаем PostgreSQL
            if [ ! "$(docker ps -q -f name=postgres-db)" ]; then
              if [ "$(docker ps -aq -f status=exited -f name=postgres-db)" ]; then
                docker rm postgres-db
              fi
              docker run -d \
                --name postgres-db \
                -e POSTGRES_DB=todo \
                -e POSTGRES_USER=postgres \
                -e POSTGRES_PASSWORD=postgres \
                -v postgres-data:/var/lib/postgresql/data \
                --network todo-network \
                --restart unless-stopped \
                postgres:15
            fi

            # Ожидание готовности PostgreSQL
            for i in $(seq 1 30); do
              docker exec postgres-db pg_isready -U postgres && break
              echo "Ожидание PostgreSQL... ($i/30)"
              sleep 2
            done

            # === Миграция БД (Stage 4): переименование account → task_list ===
            docker exec postgres-db psql -U postgres -d todo -c "
              DO \$\$ BEGIN
                IF EXISTS (SELECT 1 FROM information_schema.tables WHERE table_name='account') THEN
                  ALTER TABLE account RENAME TO task_list;
                END IF;
                IF EXISTS (SELECT 1 FROM information_schema.tables WHERE table_name='account_user') THEN
                  ALTER TABLE account_user RENAME TO task_list_user;
                END IF;
                IF EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name='task_list_user' AND column_name='account_id') THEN
                  ALTER TABLE task_list_user RENAME COLUMN account_id TO list_id;
                END IF;
                IF EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name='todo' AND column_name='account_id') THEN
                  ALTER TABLE todo RENAME COLUMN account_id TO list_id;
                END IF;
              END \$\$;
            "
            echo "Миграция Stage 4 (account → task_list) завершена"
            # === Конец миграции Stage 4 ===

            # === Миграция БД (Stage 3): аккаунты, BCrypt, цвета ===
            docker exec postgres-db psql -U postgres -d todo -c "
              DO \$\$ BEGIN
                IF EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name='todo' AND column_name='date_time') THEN
                  ALTER TABLE todo RENAME COLUMN date_time TO created_at;
                END IF;
              END \$\$;

              ALTER TABLE todo_users
                ADD COLUMN IF NOT EXISTS created_task_color  VARCHAR(7) NOT NULL DEFAULT '#4285F4',
                ADD COLUMN IF NOT EXISTS completed_task_color VARCHAR(7) NOT NULL DEFAULT '#34A853';

              CREATE TABLE IF NOT EXISTS task_list (
                id            BIGSERIAL PRIMARY KEY,
                name          VARCHAR(128) NOT NULL UNIQUE,
                password_hash VARCHAR(128) NOT NULL,
                created_at    TIMESTAMP NOT NULL DEFAULT NOW()
              );

              CREATE TABLE IF NOT EXISTS task_list_user (
                list_id    BIGINT NOT NULL REFERENCES task_list(id),
                user_id    BIGINT NOT NULL REFERENCES todo_users(id),
                role       VARCHAR(16) NOT NULL DEFAULT 'USER',
                joined_at  TIMESTAMP NOT NULL DEFAULT NOW(),
                PRIMARY KEY (list_id, user_id)
              );

              ALTER TABLE todo
                ADD COLUMN IF NOT EXISTS completed_at      TIMESTAMP,
                ADD COLUMN IF NOT EXISTS completor_user_id BIGINT REFERENCES todo_users(id),
                ADD COLUMN IF NOT EXISTS is_private        BOOLEAN NOT NULL DEFAULT FALSE,
                ADD COLUMN IF NOT EXISTS list_id           BIGINT REFERENCES task_list(id);

              DELETE FROM todo;
              DELETE FROM todo_users;
            "
            echo "Миграция БД завершена"
            # === Конец миграции ===

            # Остановка старого приложения
            docker pull mngerasimenko/todo-app:${{ github.sha }}
            docker stop todo-app 2>/dev/null || true
            docker rm todo-app 2>/dev/null || true
            docker run -d \
              --name todo-app \
              -p 8090:8090 \
              -e SPRING_DATASOURCE_URL='jdbc:postgresql://postgres-db:5432/todo' \
              -e SPRING_DATASOURCE_USERNAME=postgres \
              -e SPRING_DATASOURCE_PASSWORD=postgres \
              -e SPRING_JPA_HIBERNATE_DDL_AUTO=update \
              -e SPRING_PROFILES_ACTIVE=production \
              -e APP_VERSION=${{ env.APP_VERSION_MAJOR }}.${{ env.APP_VERSION_MINOR }}.${{ github.run_number }} \
              -e MIN_ANDROID_VERSION=3 \
              -v todo-logs:/todo/logs \
              --network todo-network \
              --restart unless-stopped \
              mngerasimenko/todo-app:${{ github.sha }}