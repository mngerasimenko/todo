name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Deploy target'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
          - rollback-production
      target_sha:
        description: 'Target SHA for rollback (empty = use saved deploy-prev.txt)'
        required: false
        default: ''

jobs:
  # ============================================
  # Этап 1: Запуск тестов с покрытием
  # ============================================
  test:
    if: github.event.inputs.deploy_target != 'rollback-production'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests with JaCoCo coverage
        run: mvn clean test

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 7

  # ============================================
  # Этап 2: Сборка Docker-образа
  # ============================================
  build:
    needs: test
    if: |
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.event.inputs.deploy_target != 'rollback-production'
    runs-on: ubuntu-latest
    env:
      APP_VERSION_MAJOR: 0
      APP_VERSION_MINOR: 2
      APP_VERSION_PATCH_OFFSET: 251

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute patch version
        run: echo "APP_PATCH=$(( ${{ github.run_number }} - ${{ env.APP_VERSION_PATCH_OFFSET }} ))" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build package (skip tests — already passed)
        run: mvn clean package -DskipTests

      - name: Archive application JAR
        uses: actions/upload-artifact@v4
        with:
          name: todo-app-jar
          path: target/*.jar
          retention-days: 7

      - name: Build Docker image
        run: docker build -t mngerasimenko/todo-app:${{ github.sha }} .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Push to Docker Hub
        run: |
          docker tag mngerasimenko/todo-app:${{ github.sha }} mngerasimenko/todo-app:latest
          docker push mngerasimenko/todo-app:${{ github.sha }}
          docker push mngerasimenko/todo-app:latest

  # ============================================
  # Этап 3: Деплой на staging (автоматически при push)
  # ============================================
  deploy-staging:
    needs: build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_target == 'staging')
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to staging via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root/todo

            # Update repo
            git fetch origin master
            git reset --hard origin/master
            
            # Create volumes/network if not exist (idempotent)
            docker network create staging-network 2>/dev/null || true
            docker volume create staging-redis-data 2>/dev/null || true
            docker volume create staging-postgres-data 2>/dev/null || true

            # Pull all images (app + redis)
            docker compose -f docker-compose.staging.yml pull

            # Bring up all services; compose recreates only those with changes
            docker compose -f docker-compose.staging.yml up -d

            # Cleanup: remove all unused images and build cache to prevent disk fill
            docker image prune -a -f 2>/dev/null || true
            docker builder prune -a -f 2>/dev/null || true

            echo "Staging deployed successfully"

  # ============================================
  # Этап 4: Деплой на production (только вручную)
  # ============================================
  deploy-production:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_target == 'production'
    runs-on: ubuntu-latest
    environment: production
    env:
      MIN_ANDROID_VERSION: 7
      LATEST_ANDROID_VERSION: 18
      APP_VERSION_MAJOR: 0
      APP_VERSION_MINOR: 2
      APP_VERSION_PATCH_OFFSET: 251
      DEPLOY_DIR: ${{ secrets.DEPLOY_DIR || '/home/deploy/todo' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute patch version
        run: echo "APP_PATCH=$(( ${{ github.run_number }} - ${{ env.APP_VERSION_PATCH_OFFSET }} ))" >> $GITHUB_ENV

      - name: Copy docker-compose.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml"
          target: "${{ env.DEPLOY_DIR }}"

      - name: Deploy to production via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd "${{ env.DEPLOY_DIR }}"

            # Update repo (nginx.conf, assetlinks.json, monitoring)
            git fetch origin master
            git reset --hard origin/master

            # Create network and volumes if not exist
            docker network create todo-network 2>/dev/null || true
            docker volume create postgres-data 2>/dev/null || true
            docker volume create todo-logs 2>/dev/null || true
            docker volume create certbot-conf 2>/dev/null || true
            docker volume create certbot-www 2>/dev/null || true
            docker volume create prometheus-data 2>/dev/null || true
            docker volume create grafana-data 2>/dev/null || true

            # Записываем .env рядом с docker-compose.yml — чтобы любой
            # последующий `docker compose up` (в т.ч. от других проектов
            # на этом же хосте) подхватывал актуальные значения, а не падал
            # на фоллбеки `0.0.1` / `MIN_ANDROID_VERSION=1`.
            cat > .env <<EOF
            APP_VERSION=${{ env.APP_VERSION_MAJOR }}.${{ env.APP_VERSION_MINOR }}.${{ env.APP_PATCH }}
            MIN_ANDROID_VERSION=${{ env.MIN_ANDROID_VERSION }}
            LATEST_ANDROID_VERSION=${{ env.LATEST_ANDROID_VERSION }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
            MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
            FIREBASE_ENABLED=true
            INACTIVE_REMINDER_ENABLED=${INACTIVE_REMINDER_ENABLED:-true}
            ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            GRAFANA_ADMIN_PASSWORD=${{ secrets.GRAFANA_ADMIN_PASSWORD }}
            EOF
            chmod 600 .env

            # === Pre-deploy rollback support ===
            # Сохраняем immutable digest текущего образа (не тег :latest из compose,
            # который бесполезен для отката — при rollback записался бы тот же :latest).
            # Формат: mngerasimenko/todo-app@sha256:<hash> — docker compose это принимает.
            # Двухступенчато: у контейнера нет поля RepoDigests, оно только у image.
            PREV_IMAGE_ID=$(docker inspect --format='{{.Image}}' todo-app 2>/dev/null || echo "")
            if [ -n "$PREV_IMAGE_ID" ]; then
              docker image inspect --format='{{index .RepoDigests 0}}' "$PREV_IMAGE_ID" > deploy-prev.txt 2>/dev/null || true
            fi

            # pg_dump перед обновлением — страховка от неудачной миграции
            mkdir -p backups/pre-deploy
            BACKUP_FILE="backups/pre-deploy/$(date +%Y%m%d-%H%M%S).dump"
            docker exec postgres-db pg_dump -U postgres -Fc todo > "$BACKUP_FILE" 2>/dev/null \
              && echo "pre-deploy backup saved: $BACKUP_FILE" \
              || echo "WARN: pre-deploy pg_dump failed, continuing"
            # Ротация: храним 5 последних pre-deploy дампов
            ls -1t backups/pre-deploy/*.dump 2>/dev/null | tail -n +6 | xargs -r rm -f

            # Pull and restart app.
            # Явный pull по SHA-тегу (а не :latest) — гарантирует, что мы возьмём
            # именно ту сборку, что только что запушил build job. Наблюдалось
            # 27 апр 2026: `docker compose pull todo-app` не обновил local :latest
            # (digest на DockerHub был свежий, на сервере оставался от предыдущего
            # деплоя), контейнер пересоздался на старом образе, в /api/status
            # отсутствовали новые поля. Pull по SHA — deterministic, не зависит
            # от состояния local manifest cache.
            #
            # Pre-deploy блок выше (deploy-prev.txt) уже сохранил digest текущего
            # running контейнера до этого pull — rollback на эту версию по-прежнему
            # работает через `mngerasimenko/todo-app@sha256:...`.
            docker pull mngerasimenko/todo-app:${{ github.sha }}
            docker tag mngerasimenko/todo-app:${{ github.sha }} mngerasimenko/todo-app:latest

            docker compose pull prometheus grafana
            docker compose up -d --force-recreate --no-deps todo-app
            docker compose up -d prometheus grafana

            # Ensure external configs dir exists — volume bind-mount нуждается в существующем каталоге
            # (Docker создаст сам, но с правами root; лучше явно).
            mkdir -p /home/deploy/nginx-external

            # Nginx reload/recreate с защитой от битого external-конфига.
            # Сценарий: если clickmebattle (или другой внешний проект) положил в
            # /home/deploy/nginx-external/ невалидный .conf — наш nginx-proxy
            # упадёт на старте, и todo уйдёт в 502. Защита:
            #   1) Пре-валидация конфига (`nginx -t` в текущем контейнере).
            #   2) Если test failed — карантинируем все external .conf и пробуем снова.
            #   3) Если и без external test fails — значит проблема у нас, прерываем.
            nginx_config_test() {
              docker exec nginx-proxy nginx -t >/tmp/nginx-t.log 2>&1
            }
            quarantine_external() {
              local ts="$(date +%Y%m%d-%H%M%S)"
              mkdir -p /home/deploy/nginx-external-quarantine
              for f in /home/deploy/nginx-external/*.conf; do
                [ -f "$f" ] || continue
                mv "$f" "/home/deploy/nginx-external-quarantine/$(basename "$f").${ts}" \
                  && echo "WARN: quarantined bad external config: $(basename "$f")"
              done
            }
            if docker inspect nginx-proxy --format '{{range .Mounts}}{{.Destination}} {{end}}' 2>/dev/null | grep -q '/etc/nginx/external'; then
              # Volume уже смонтирован — можно тестировать на живом контейнере
              if ! nginx_config_test; then
                echo "WARN: nginx config test failed, last output:"; cat /tmp/nginx-t.log
                quarantine_external
                if ! nginx_config_test; then
                  echo "ERROR: nginx config still broken after quarantine — own config issue, aborting nginx restart"
                  cat /tmp/nginx-t.log
                  exit 1
                fi
                echo "WARN: nginx config restored after quarantine; clickmebattle/external site may be down until owner fixes their config"
              fi
              docker exec nginx-proxy nginx -s reload 2>/dev/null || \
                docker compose up -d --force-recreate nginx-proxy 2>/dev/null || true
            else
              # Первый деплой с новым volume — старый контейнер без /etc/nginx/external,
              # тестировать негде, делаем force-recreate и проверяем health.
              echo "External configs volume not yet mounted — force-recreating nginx-proxy"
              docker compose up -d --force-recreate nginx-proxy
              sleep 3
              if ! docker ps --filter "name=nginx-proxy" --filter "status=running" --format '{{.Names}}' | grep -q '^nginx-proxy$'; then
                echo "WARN: nginx-proxy not running after recreate — quarantining external configs"
                quarantine_external
                docker compose up -d --force-recreate nginx-proxy
                sleep 3
                if ! docker ps --filter "name=nginx-proxy" --filter "status=running" --format '{{.Names}}' | grep -q '^nginx-proxy$'; then
                  echo "ERROR: nginx-proxy still down after quarantine — own config issue"
                  docker logs --tail 50 nginx-proxy || true
                  exit 1
                fi
                echo "WARN: nginx-proxy up after quarantine; external sites may be down until owner fixes their config"
              fi
            fi

            # Cleanup: remove all unused images and build cache to prevent disk fill
            docker image prune -a -f 2>/dev/null || true
            docker builder prune -a -f 2>/dev/null || true

            # Fix monitoring scripts (CRLF → LF, +x)
            sed -i 's/\r$//' /home/deploy/todo/monitoring/*.sh 2>/dev/null || true
            chmod +x /home/deploy/todo/monitoring/*.sh 2>/dev/null || true

            echo "Production deployed successfully"

  # ============================================
  # Этап 5: Откат production (только вручную)
  # ============================================
  rollback-production:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_target == 'rollback-production'
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_DIR: ${{ secrets.DEPLOY_DIR || '/home/deploy/todo' }}
    steps:
      - name: Rollback production to previous or specified SHA
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd "${{ env.DEPLOY_DIR }}"
            # Определяем целевой тег
            TARGET="${{ github.event.inputs.target_sha }}"
            if [ -z "$TARGET" ]; then
              if [ ! -s deploy-prev.txt ]; then
                echo "ERROR: target_sha не указан, а deploy-prev.txt отсутствует или пустой"
                exit 1
              fi
              TARGET=$(cat deploy-prev.txt)
              echo "Использую тег из deploy-prev.txt: $TARGET"
            else
              case "$TARGET" in
                mngerasimenko/todo-app:*|mngerasimenko/todo-app@*) ;;
                *) TARGET="mngerasimenko/todo-app:$TARGET" ;;
              esac
              echo "Откат на указанный тег: $TARGET"
            fi
            # Подменяем image todo-app в docker-compose.yml
            cp docker-compose.yml docker-compose.yml.bak
            sed -i -E "s|^(\s*image:\s*)mngerasimenko/todo-app[:@].*|\1$TARGET|" docker-compose.yml
            # Проверяем что замена прошла
            if ! grep -q "image:\s*$TARGET" docker-compose.yml; then
              echo "ERROR: не удалось подменить image в docker-compose.yml"
              mv docker-compose.yml.bak docker-compose.yml
              exit 1
            fi

            docker compose pull todo-app
            docker compose up -d --force-recreate todo-app

            # Smoke test — через docker network (todo-app не опубликован на хост)
            sleep 3
            if docker exec nginx-proxy curl -fsS http://todo-app:8090/api/status > /dev/null 2>&1; then
              echo "Rollback на $TARGET выполнен, /api/status отвечает 200"
            else
              echo "WARN: /api/status недоступен после отката — проверь логи"
            fi
