name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  # ============================================
  # Этап 1: Запуск тестов с покрытием
  # ============================================
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests with JaCoCo coverage
        run: mvn clean test

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 30

  # ============================================
  # Этап 2: Сборка и деплой (только для пуши в master)
  # ============================================
  deploy:
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      APP_VERSION_MAJOR: 0
      APP_VERSION_MINOR: 1
      APP_VERSION_PATCH_OFFSET: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute patch version
        run: echo "APP_PATCH=$(( ${{ github.run_number }} - ${{ env.APP_VERSION_PATCH_OFFSET }} ))" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build package (skip tests — already passed)
        run: mvn clean package -DskipTests

      - name: Archive application JAR
        uses: actions/upload-artifact@v4
        with:
          name: todo-app-jar
          path: target/*.jar

      - name: Build Docker image
        run: docker build -t mngerasimenko/todo-app:${{ github.sha }} .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Push to Docker Hub
        run: docker push mngerasimenko/todo-app:${{ github.sha }}

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root

            # Создаём сеть, если не существует
            docker network create todo-network 2>/dev/null || true

            # Запускаем/перезапускаем PostgreSQL
            if [ ! "$(docker ps -q -f name=postgres-db)" ]; then
              if [ "$(docker ps -aq -f status=exited -f name=postgres-db)" ]; then
                docker rm postgres-db
              fi
              docker run -d \
                --name postgres-db \
                -e POSTGRES_DB=todo \
                -e POSTGRES_USER=postgres \
                -e POSTGRES_PASSWORD=postgres \
                -v postgres-data:/var/lib/postgresql/data \
                --network todo-network \
                --restart unless-stopped \
                postgres:15
            fi

            # Ожидание готовности PostgreSQL
            for i in $(seq 1 30); do
              docker exec postgres-db pg_isready -U postgres && break
              echo "Ожидание PostgreSQL... ($i/30)"
              sleep 2
            done

            # Остановка старого приложения
            docker pull mngerasimenko/todo-app:${{ github.sha }}
            docker stop todo-app 2>/dev/null || true
            docker rm todo-app 2>/dev/null || true
            docker run -d \
              --name todo-app \
              -e SPRING_DATASOURCE_URL='jdbc:postgresql://postgres-db:5432/todo' \
              -e SPRING_DATASOURCE_USERNAME=postgres \
              -e SPRING_DATASOURCE_PASSWORD=postgres \
              -e SPRING_PROFILES_ACTIVE=production \
              -e APP_VERSION=${{ env.APP_VERSION_MAJOR }}.${{ env.APP_VERSION_MINOR }}.${{ env.APP_PATCH }} \
              -v todo-logs:/todo/logs \
              --network todo-network \
              --restart unless-stopped \
              mngerasimenko/todo-app:${{ github.sha }}

            # Перезагрузка nginx-proxy для подхвата нового контейнера
            docker exec nginx-proxy nginx -s reload 2>/dev/null || true