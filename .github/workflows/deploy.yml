name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  # ============================================
  # Этап 1: Запуск тестов с покрытием
  # ============================================
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests with JaCoCo coverage
        run: mvn clean test

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 30

  # ============================================
  # Этап 2: Сборка и деплой (только для пуши в master)
  # ============================================
  deploy:
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      APP_VERSION_MAJOR: 0
      APP_VERSION_MINOR: 1
      APP_VERSION_PATCH_OFFSET: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute patch version
        run: echo "APP_PATCH=$(( ${{ github.run_number }} - ${{ env.APP_VERSION_PATCH_OFFSET }} ))" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build package (skip tests — already passed)
        run: mvn clean package -DskipTests

      - name: Archive application JAR
        uses: actions/upload-artifact@v4
        with:
          name: todo-app-jar
          path: target/*.jar

      - name: Build Docker image
        run: docker build -t mngerasimenko/todo-app:${{ github.sha }} .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Push to Docker Hub
        run: |
          docker tag mngerasimenko/todo-app:${{ github.sha }} mngerasimenko/todo-app:latest
          docker push mngerasimenko/todo-app:${{ github.sha }}
          docker push mngerasimenko/todo-app:latest

      - name: Copy docker-compose.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml"
          target: "/root/todo/"

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root/todo

            # Обновление репозитория (nginx.conf, assetlinks.json, мониторинг)
            git pull origin master 2>/dev/null || true

            # Создаём сеть и volumes, если не существуют
            docker network create todo-network 2>/dev/null || true
            docker volume create postgres-data 2>/dev/null || true
            docker volume create todo-logs 2>/dev/null || true
            docker volume create certbot-conf 2>/dev/null || true
            docker volume create certbot-www 2>/dev/null || true

            # Обновляем образ приложения
            docker compose pull todo-app

            # Перезапуск через compose (depends_on гарантирует здоровый postgres)
            APP_VERSION=${{ env.APP_VERSION_MAJOR }}.${{ env.APP_VERSION_MINOR }}.${{ env.APP_PATCH }} \
              POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }} \
              MAIL_USERNAME=${{ secrets.MAIL_USERNAME }} \
              MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }} \
              docker compose up -d todo-app

            # Пересоздание nginx-proxy (для подхвата новых volumes и конфига)
            docker compose up -d --force-recreate nginx-proxy 2>/dev/null || \
              docker exec nginx-proxy nginx -s reload 2>/dev/null || true

            # Очистка неиспользуемых образов
            docker image prune -f 2>/dev/null || true

            # Обновление скриптов мониторинга
            cp /root/todo/monitoring/server-monitor.sh /root/monitoring/server-monitor.sh 2>/dev/null || true
            cp /root/todo/monitoring/backup.sh /root/monitoring/backup.sh 2>/dev/null || true
            chmod +x /root/monitoring/*.sh 2>/dev/null || true