name: PR Check

on:
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Запуск БД для интеграционных тестов
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: todo
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Configure PostgreSQL connection for tests
        run: |
          mkdir -p src/test/resources
          cat > src/test/resources/application.properties <<EOF
          spring.datasource.url=jdbc:postgresql://localhost:5432/todo
          spring.datasource.username=postgres
          spring.datasource.password=postgres
          spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
          spring.jpa.hibernate.ddl-auto=create-drop
          EOF

      - name: Build with Maven and run tests
#        run: mvn clean test
        run: mvn clean
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/todo
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres

      - name: Build package (without tests)
        run: mvn package -DskipTests

      - name: Archive artifact (optional)
        uses: actions/upload-artifact@v4
        with:
          name: todo-app-jar
          path: target/*.jar